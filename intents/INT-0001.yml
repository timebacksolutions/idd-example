uid: INT-0001
type: intent
status: ratified
title: Residents manage their council-housing account securely online
text: A resident of the council can view their tenancy, report repairs and update
  their contact details through a self-service account, trusting that access to that
  account is protected to a recognised security baseline rather than to whatever
  the delivery team happened to think of.
normative: false
