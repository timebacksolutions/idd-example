uid: UR-0001
type: user_requirement
status: ratified
title: Residents authenticate securely
text: A resident signs in with credentials that are held to the same strength, length
  and breach-resistance controls a security assessor would expect, so that an account
  cannot be trivially guessed or reused from a leaked password set.
normative: true
